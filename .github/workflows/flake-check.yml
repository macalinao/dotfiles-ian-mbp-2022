name: Flake Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake syntax
        run: nix-instantiate --parse flake.nix > /dev/null

      - name: Check flake schema
        run: nix flake check --no-build --all-systems 2>&1 || echo "::warning::Flake check failed (expected due to local file dependencies)"

      - name: Show flake info
        run: nix flake metadata --json 2>&1 | head -100 || echo "::warning::Could not fetch flake metadata (expected due to local file dependencies)"
